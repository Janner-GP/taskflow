# ===========================================================================
# STACK DE PRODUCCIÓN
#
#   docker compose up --build
#
# Requiere un archivo .env con todas las variables del .env.example.
# La base de datos NO se levanta aquí: en producción usa RDS.
# Para desarrollo local usa docker-compose.dev.yml (solo postgres).
# ===========================================================================

name: taskflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
