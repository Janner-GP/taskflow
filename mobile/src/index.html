<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <base href="/" />

    <!--
      viewport-fit=cover is what lets Ionic's safe-area insets work: without it
      the notch and the home indicator overlap the content on modern phones.
      user-scalable=no stops the accidental pinch-zoom of an app UI while
      maximum-scale is left alone so OS-level accessibility zoom still applies.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- Lets the WebView pick the native form controls and scrollbars per scheme. -->
    <meta name="color-scheme" content="light dark" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
