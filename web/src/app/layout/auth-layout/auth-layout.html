<div class="relative flex min-h-screen flex-col">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-72 bg-linear-to-b from-primary-500/10 to-transparent"></div>

  <header class="relative flex items-center gap-3 px-6 py-5">
    <span class="flex items-center gap-2 font-semibold tracking-tight">
      <span class="grid size-8 place-items-center rounded-control bg-primary-600 text-primary-contrast">TF</span>
      TaskFlow
    </span>

    <div class="ml-auto flex items-center gap-2">
      <app-language-switcher />
      <app-theme-toggle />
    </div>
  </header>

  <main class="relative flex flex-1 items-center justify-center px-6 py-10">
    <div class="w-full max-w-md">
      <div
        class="rounded-surface border border-surface bg-surface-0 p-8 shadow-soft sm:p-10 dark:bg-surface-900"
      >
        <router-outlet />
      </div>
    </div>
  </main>

  <footer class="relative px-6 py-6 text-center text-sm text-muted-color">
    {{ 'shell.footer' | translate }}
  </footer>
</div>
