<div
  role="alert"
  class="flex flex-col items-center gap-3 rounded-card border border-red-200 bg-red-50 px-6 py-14 text-center dark:border-red-900/60 dark:bg-red-950/40"
>
  <svg
    class="size-10 text-red-600 dark:text-red-400"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 9v3.75m0 3.75h.008M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.62 0Z"
    />
  </svg>
  <p class="max-w-sm text-sm text-red-700 dark:text-red-300">{{ message() }}</p>
  @if (retryLabel()) {
    <p-button [label]="retryLabel()" severity="danger" [outlined]="true" (onClick)="retry.emit()" />
  }
</div>
