<div class="flex gap-0.5 rounded-lg bg-surface-100 p-0.5 dark:bg-surface-800" role="group" aria-label="Language">
  @for (lang of languages; track lang) {
    <button
      type="button"
      [class]="langClass(lang)"
      (click)="use(lang)"
    >
      {{ lang.toUpperCase() }}
    </button>
  }
</div>
